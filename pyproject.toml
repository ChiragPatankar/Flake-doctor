[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "flake-doctor"
version = "0.2.0"
description = "Find flaky pytest tests in your GitHub Actions history, then diagnose and fix them with evidence."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Chirag Patankar"}]
requires-python = ">=3.9"
dependencies = []
keywords = ["flaky tests", "pytest", "github actions", "ci", "testing", "test reliability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/ChiragPatankar/flake-doctor"
Issues = "https://github.com/ChiragPatankar/flake-doctor/issues"

[project.scripts]
flake-doctor = "flake_doctor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
